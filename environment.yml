# YOLO 安防监控系统 Conda 环境配置
# 使用方法：
#   创建环境: conda env create -f environment.yml
#   更新环境: conda env update -f environment.yml --prune
#   激活环境: conda activate yolo
#   删除环境: conda env remove -n yolo

name: yolo
channels:
  - conda-forge
  - defaults

dependencies:
  # Python 版本（与 AGENTS.md 中规定的 3.11 保持一致）
  - python=3.11

  # 通过 conda 安装的核心二进制依赖（比 pip 更稳定）
  - pip

  # 通过 pip 安装项目依赖（复用 requirements-dev.txt，含运行时 + 开发/测试依赖）
  - pip:
      - -r requirements-dev.txt
